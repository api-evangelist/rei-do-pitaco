description: Rei do Pitaco is a Brazilian online sports betting, daily fantasy sports, and casino
  platform founded in 2019 and headquartered in Brazil. The service offers competitive sports odds,
  live in-play betting, daily fantasy sports contests, and casino games aimed at the Brazilian
  market. As a regulated iGaming operator its consumer web and mobile properties are geo-restricted
  outside Brazil (the primary domains return HTTP 451 to non-Brazilian visitors), and the company
  exposes no public developer API, documentation, or SDK surface. Rei do Pitaco is backed by Bullpen
  Capital and was added to the API Evangelist network as a portfolio-sourced company profile.
